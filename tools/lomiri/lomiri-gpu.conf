# /etc/systemd/user/lomiri.service.d: the shell (Mir + Lomiri) on the A418 Mesa,
# rendering straight to RAM (GMEM renders garbage so far).
[Service]
UnsetEnvironment=LIBGL_ALWAYS_SOFTWARE
Environment=LD_LIBRARY_PATH=/opt/mesa-a418/lib/aarch64-linux-gnu
Environment=LIBGL_DRIVERS_PATH=/opt/mesa-a418/lib/aarch64-linux-gnu/dri
Environment=GBM_BACKENDS_PATH=/opt/mesa-a418/lib/aarch64-linux-gnu/gbm
Environment=FD_MESA_DEBUG=sysmem

# no working depth buffer on the shell's output surface: draw back to
# front (otherwise opaque apps end up under the wallpaper)
Environment=QSG_NO_DEPTH_BUFFER=1
